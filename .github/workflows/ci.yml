name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags: [ '', '-race' ]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
        env:
          discovery.type: single-node
          bootstrap.memory_lock: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
          ELASTIC_PASSWORD: "Es123456"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --ulimit memlock=-1:-1
          --ulimit nofile=65536:65536
        ports:
          - 9200:9200

      opensearch:
        image: opensearchproject/opensearch:2.18.0
        env:
          discovery.type: single-node
          bootstrap.memory_lock: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Op3nS3arch!"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --ulimit memlock=-1:-1
          --ulimit nofile=65536:65536
        ports:
          - 9300:9200

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Wait for services to be ready
        run: |
          echo "Installing PostgreSQL client..."
          sudo apt-get update && sudo apt-get install -y postgresql-client || true
          
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done' || true
          
          echo "Waiting for Elasticsearch..."
          timeout 120 bash -c 'until curl -f http://localhost:9200/_cluster/health; do sleep 2; done' || true
          
          echo "Waiting for OpenSearch..."
          timeout 120 bash -c 'until curl -f http://localhost:9300/_cluster/health; do sleep 2; done' || true

      - name: Test
        env:
          LOG_LEVEL: error
          ELASTICSEARCH_ADDRESS: http://localhost:9200
          ELASTICSEARCH_USER: admin
          ELASTICSEARCH_PASSWORD: Es123456
          OPENSEARCH_ADDRESS: http://localhost:9300
          OPENSEARCH_USER: admin
          OPENSEARCH_PASSWORD: Op3nS3arch!

        run: go test -coverprofile=profile${{ matrix.flags }}.out -covermode=atomic ${{ matrix.flags }} -coverpkg=./... ./...

      - name: Strip generated files from coverage
        run: |
          grep -v -e ".pb.go:" -e ".pb.gw.go:" -e ".mock.go:" -e "/mock/" profile${{ matrix.flags }}.out > profile${{ matrix.flags }}.out.clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage${{ matrix.flags }}
          path: profile${{ matrix.flags }}.out.clean
          if-no-files-found: error
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          only-new-issues: false
          args: --timeout 5m
          skip-cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check imports order
        run: |
          find . \
            -path './pkg' -prune -o \
            -type f -name '*.go' \
            ! -name '*.pb.go' \
            ! -name '*.pb.gw.go' \
            ! -name '*_mock.go' \
            -exec goimports -w -local 'github.com/romanchechyotkin/syncgo' {} +
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Codebase is not goimports-ed. Please run `make imports`'
            git --no-pager diff
            exit 1
          fi

  check-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "32.1"

      
      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1  

      - name: Download dependencies
        run: go mod download && go mod tidy

      - name: Verify modules
        run: go mod verify

      - name: Go generate
        run: go generate ./...
      
      - name: Generate protobuf files
        run: make generate

      - name: Check git diff
        run: git diff --exit-code

  coverage:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download coverage artifacts
      uses: actions/download-artifact@v4
      with:
        name: coverage 
        path: ./

    - name: Check test coverage
      uses: vladopajic/go-test-coverage@v2
      with:
        profile: profile.out.clean
        local-prefix: "github.com/romanchechyotkin/syncgo"
        threshold-file: 0
        threshold-package: 0
        threshold-total: 40

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: |
          profile$.out
        if-no-files-found: error
        retention-days: 1
