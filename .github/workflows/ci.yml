name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags: [ '', '-race' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        env:
          LOG_LEVEL: error

        run: go test -coverprofile=profile${{ matrix.flags }}.out -covermode=atomic ${{ matrix.flags }} -short -coverpkg=./... ./...

      - name: Strip generated files from coverage
        run: |
          grep -v -e ".pb.go:" -e ".pb.gw.go:" -e ".mock.go:" -e "/mock/" profile${{ matrix.flags }}.out > profile${{ matrix.flags }}.out.clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage${{ matrix.flags }}
          path: profile${{ matrix.flags }}.out.clean
          if-no-files-found: error
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start services
        run: docker compose -f e2e/docker-compose.yml up -d --wait --wait-timeout 300

      - name: E2E tests
        run: go test -v -tags e2e -timeout 5m ./e2e/...

      - name: Stop services
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          only-new-issues: false
          args: --timeout 5m
          skip-cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check imports order
        run: |
          find . \
            -path './pkg' -prune -o \
            -type f -name '*.go' \
            ! -name '*.pb.go' \
            ! -name '*.pb.gw.go' \
            ! -name '*_mock.go' \
            -exec goimports -w -local 'github.com/romanchechyotkin/syncgo' {} +
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Codebase is not goimports-ed. Please run `make imports`'
            git --no-pager diff
            exit 1
          fi

  check-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate all
        run: make generate

      - name: Check git diff
        run: git diff --exit-code

  coverage:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download coverage artifacts
      uses: actions/download-artifact@v4
      with:
        name: coverage 
        path: ./

    - name: Check test coverage
      uses: vladopajic/go-test-coverage@v2
      with:
        profile: profile.out.clean
        local-prefix: "github.com/romanchechyotkin/syncgo"
        threshold-file: 0
        threshold-package: 0
        threshold-total: 40

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: |
          profile$.out
        if-no-files-found: error
        retention-days: 1

  coverage-new-code:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: ./

      - name: Check coverage of new code (≥80%)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            BASE="origin/$BASE_REF"
          else
            BASE="$BEFORE_SHA"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE"...HEAD \
            | grep '\.go$' \
            | grep -v '\.pb\.go$' \
            | grep -v '\.pb\.gw\.go$' \
            | grep -v '_mock\.go$' \
            | grep -v '/mock/' \
            || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No new Go files to check coverage for."
            exit 0
          fi

          echo "Changed Go files:"
          echo "$CHANGED_FILES"

          PROFILE="profile.out.clean"
          TOTAL=0
          COVERED=0

          while IFS= read -r file; do
            PKG_PATH="github.com/romanchechyotkin/syncgo/${file}"
            while IFS= read -r line; do
              STMTS=$(echo "$line" | awk '{print $2}')
              COUNT=$(echo "$line" | awk '{print $3}')
              TOTAL=$((TOTAL + STMTS))
              if [ "$COUNT" -gt 0 ]; then
                COVERED=$((COVERED + STMTS))
              fi
            done < <(grep "^${PKG_PATH}:" "$PROFILE" || true)
          done <<< "$CHANGED_FILES"

          if [ "$TOTAL" -eq 0 ]; then
            echo "No testable statements found in coverage profile for changed files."
            exit 0
          fi

          PERCENT=$(awk "BEGIN { printf \"%.1f\", ($COVERED / $TOTAL) * 100 }")
          echo "New code coverage: ${PERCENT}% (${COVERED}/${TOTAL} statements)"

          PASS=$(awk "BEGIN { print ($COVERED / $TOTAL >= 0.8) ? \"yes\" : \"no\" }")
          if [ "$PASS" = "no" ]; then
            echo "FAIL: Coverage of new code is ${PERCENT}%, required ≥80%"
            exit 1
          fi

          echo "PASS: Coverage of new code is ${PERCENT}%"
