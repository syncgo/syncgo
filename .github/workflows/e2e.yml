name: E2E

on:
  push:
    branches: [ master, release/* ]
    tags:
      - "v*.*.*"
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ master, release/* ]
    paths-ignore:
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start services
        run: docker compose -f e2e/docker-compose.yml up -d --wait --wait-timeout 300

      - name: "E2E tests (in-process: elastic & opensearch)"
        run: go test -v -tags e2e -timeout 5m ./e2e/elastic/... ./e2e/opensearch/...

      - name: "E2E tests (pipeline, via compiled binary)"
        run: make binary_test

      - name: Stop services
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
