name: E2E

on:
  push:
    branches: [ master, release/* ]
    tags:
      - "v*.*.*"
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ master, release/* ]
    paths-ignore:
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  e2e-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start services
        run: docker compose -f e2e/docker-compose.yml up -d --wait --wait-timeout 300

      - name: Create table and publication
        run: |
          docker compose -f e2e/docker-compose.yml exec -T postgres \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS test (id int primary key, name text);
          CREATE PUBLICATION test_publication FOR TABLE public.test;
          SQL

      - name: Build syncgo binary
        run: go build -o syncgo ./cmd/syncgo

      - name: Run syncgo binary
        run: ./syncgo run --config e2e/config.yaml > syncgo.log 2>&1 &

      - name: Wait for replication slot
        run: |
          for i in $(seq 1 60); do
            active=$(docker compose -f e2e/docker-compose.yml exec -T postgres \
              psql -U postgres -d postgres -tAc \
              "SELECT active FROM pg_replication_slots WHERE slot_name='test_slot'")
            if [ "$active" = "t" ]; then exit 0; fi
            sleep 1
          done
          echo "replication slot did not become active"
          exit 1

      - name: Insert, update and delete tests
        run: go test -v -tags e2e -timeout 5m ./e2e/pipeline/...

      - name: Show syncgo logs
        if: failure()
        run: cat syncgo.log

      - name: Stop services
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v


  e2e-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start services
        run: docker compose -f e2e/docker-compose.yml up -d --wait --wait-timeout 300

      - name: Create table and publication
        run: |
          docker compose -f e2e/docker-compose.yml exec -T postgres \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS test (id int primary key, name text);
          CREATE PUBLICATION test_publication FOR TABLE public.test;
          SQL

      - name: Build syncgo image
        run: docker build -t syncgo:e2e .

      - name: Run syncgo image
        run: |
          docker run -d --name syncgo \
            --network e2e_syncgo-network \
            -v "$PWD/e2e/config.docker.yaml:/etc/syncgo/config.yaml" \
            syncgo:e2e run --config /etc/syncgo/config.yaml

      - name: Wait for replication slot
        run: |
          for i in $(seq 1 60); do
            active=$(docker compose -f e2e/docker-compose.yml exec -T postgres \
              psql -U postgres -d postgres -tAc \
              "SELECT active FROM pg_replication_slots WHERE slot_name='test_slot'")
            if [ "$active" = "t" ]; then exit 0; fi
            sleep 1
          done
          echo "replication slot did not become active"
          exit 1

      - name: Insert, update and delete tests
        run: go test -v -tags e2e -timeout 5m ./e2e/pipeline/...

      - name: Show syncgo logs
        if: failure()
        run: docker logs syncgo

      - name: Stop services
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start services
        run: docker compose -f e2e/docker-compose.yml up -d --wait --wait-timeout 300

      - name: "E2E tests (in-process: elastic & opensearch)"
        run: go test -v -tags e2e -timeout 5m ./e2e/elastic/... ./e2e/opensearch/...

      - name: Stop services
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
